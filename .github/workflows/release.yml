name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  checks:  # the same checks as every push (Linux and Windows), on exactly the commit being released
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Package source, starter library and prebuilt screens
        run: |
          name="VisualAtlas-${GITHUB_REF_NAME}"
          mkdir -p package
          git archive --format=tar --prefix="$name/" HEAD | tar -x -C package
          cp -r web/dist "package/$name/web/dist"
          (cd package && zip -qr "../$name.zip" "$name")
      - uses: actions/upload-artifact@v4
        with:
          name: visual-atlas-package
          path: VisualAtlas-*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" VisualAtlas-*.zip --verify-tag --title "Visual Atlas $GITHUB_REF_NAME" --notes \
            "Download VisualAtlas-$GITHUB_REF_NAME.zip, right-click it, choose Properties, tick Unblock, then extract it and double-click Install Visual Atlas.cmd. See the README for details."
        env:
          GH_TOKEN: ${{ github.token }}

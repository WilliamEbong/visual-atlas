name: Checks
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: read # gitleaks lists a pull request's commits
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.14
      - run: uv run ruff check atlas tests scripts
      - run: uv run pytest -m "not live"
      - run: uv run atlas taxonomy check
      - run: uv run python scripts/check_no_data.py
      - run: uv export --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - run: uv run pip-audit -r requirements-audit.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test && npm run build && npm audit --audit-level=high
        working-directory: web
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
